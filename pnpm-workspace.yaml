packages:
  - apps/*
  - packages/*

# pnpm 11 blocks dependency build scripts unless listed here.
allowBuilds:
  # Prisma CLI + engines: downloads the schema/migration engine binary (needed for `prisma migrate`).
  '@prisma/engines': true
  prisma: true
  # esbuild (used by tsx for the seed script): installs/validates its platform binary.
  esbuild: true
  # Install-time telemetry pinger pulled in by @nestjs/swagger → deny.
  '@scarf/scarf': false
  # Native fallback build; prebuilt binaries already ship as optional deps → not needed.
  unrs-resolver: false
  # Optional native speed-up for BullMQ's msgpack; pure-JS fallback is fine.
  msgpackr-extract: false

# Packages newer than pnpm's minimum release age that we deliberately accept (latest stable Nest CLI).
minimumReleaseAgeExclude:
  - '@angular-devkit/core@22.2.0'
  - '@angular-devkit/schematics-cli@22.2.0'
  - '@angular-devkit/schematics@22.2.0'
  - '@nestjs/cli@12.0.6'
